    <!-- Matches the paper background so mobile browser chrome blends in. -->
    <meta name="theme-color" content="#f1eee7" />
    <meta name="color-scheme" content="light" />

    <!-- .ico first with an explicit size, then the SVG as `sizes="any"`:
         browsers that understand SVG favicons prefer it, the rest fall back. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <!-- Safari ignores SVG here, so this one is a PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- The font CSS is discovered inside a stylesheet, one round trip late;
         warming the connections shaves that off the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/img/portraits/portrait-elevado-960.webp" type="image/webp"
